[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palaver"
version = "0.1.0"
description = "Local-first observer, memory, and situational awareness"
requires-python = ">=3.14"

[project.scripts]
palaver = "palaver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["palaver*"]
exclude = ["tests*", "spikes*"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",  # pyflakes — the dead-code family: unused imports (F401) and
          # variables (F841), plus undefined names and f-strings with no
          # placeholders. Selected whole rather than rule-by-rule so a new
          # class of dead code is caught by default instead of by amendment.
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # import sorting — deterministic order keeps diffs small
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "inv2: INV-2 chokepoint — every source read routes through open_source_readonly",
    "inv3: INV-3 — the OpenCode account and credential tables stay unreachable",
    "inv4: INV-4 — memory is append-only; no DELETE path anywhere in palaver/memory",
    "inv5: INV-5 — memory tier is assigned at insert and immutable thereafter",
    "inv6: INV-6 — every memory carries at least one evidence anchor, enforced at write time",
    "inv8: INV-8 — injected content never reaches a user-authored channel",
    "inv9: INV-9 — no outbound HTTP client exists in the Phase 1 import graph",
]
