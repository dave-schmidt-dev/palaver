[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palaver"
version = "0.1.0"
description = "Local-first observer, memory, and situational awareness"
requires-python = ">=3.14"
# Palaver's first runtime dependency, and the only one. The version was
# verified against `pypi.org/pypi/mcp/json` on 2026-08-15 rather than pinned
# from memory: v2 renamed `FastMCP` to `MCPServer` with no back-compat alias,
# so a stale pin fails at import rather than at review. The upper bound is
# deliberate — v2 was itself a rework of v1, and the next major will be too.
#
# This pulls `httpx2`, `starlette`, and `uvicorn` in transitively. That is the
# first third-party code in the tree that can open a socket, which is why
# INV-9's gate now states the layer it covers; see `INVARIANTS.md` INV-9 and
# `tests/test_invariants.py::test_the_http_client_gate_does_not_see_dependencies`.
dependencies = ["mcp>=2.0.0,<3"]

[project.scripts]
palaver = "palaver.cli:main"

# The pane surface is the only part of Palaver that needs iTerm2, and it is
# the only part that cannot run headless. Keeping it an extra means `observe`
# and the MCP server install and run on a machine with no iTerm2 at all.
[project.optional-dependencies]
ui = ["iterm2>=2.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["palaver*"]
exclude = ["tests*", "spikes*"]

# The launchd templates are read at runtime by `palaver install-agent`, so an
# installed distribution that shipped only the .py files would render nothing.
[tool.setuptools.package-data]
"palaver.supervision" = ["*.plist.tmpl"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.4.0",
    # Present in dev so the pane-surface suite always runs rather than
    # silently skipping on a machine that merely forgot the extra.
    "iterm2>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",  # pyflakes — the dead-code family: unused imports (F401) and
          # variables (F841), plus undefined names and f-strings with no
          # placeholders. Selected whole rather than rule-by-rule so a new
          # class of dead code is caught by default instead of by amendment.
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # import sorting — deterministic order keeps diffs small
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "inv2: INV-2 chokepoint — every source read routes through open_source_readonly",
    "inv3: INV-3 — the OpenCode account and credential tables stay unreachable",
    "inv4: INV-4 — memory is append-only; no DELETE path anywhere in palaver/memory",
    "inv5: INV-5 — memory tier is assigned at insert and immutable thereafter",
    "inv6: INV-6 — every memory carries at least one evidence anchor, enforced at write time",
    "inv8: INV-8 — injected content never reaches a user-authored channel",
    "inv9: INV-9 — no outbound HTTP client exists in the Phase 1 import graph",
]
